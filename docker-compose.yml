services:
  hichat-backend:
    build: .
    container_name: hichat-backend
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000" # only exposed to localhost — Nginx on the host proxies to it
    volumes:
      - hichat-data:/app/data
    environment:
      - PORT=3000
      - AUTH_SECRET=${AUTH_SECRET}
      - ALLOWED_ORIGIN=${ALLOWED_ORIGIN}
    healthcheck:
      test: ["CMD", "bun", "-e", "fetch('http://localhost:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  hichat-data:
