<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>hichat</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Google Identity Services (for Google login) -->
  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <style>
    .hero {
      @apply bg-gradient-to-r from-indigo-600 to-purple-600 text-white;
    }
  </style>
</head>
<body class="bg-gray-50 min-h-screen flex flex-col">
  <header class="bg-gradient-to-r from-indigo-600 to-purple-600 text-white p-6">
    <div class="max-w-7xl mx-auto flex justify-between items-center">
      <h1 class="text-2xl font-bold">hichat</h1>
      <nav>
        <a href="#" class="px-4 py-2 rounded hover:bg-white/20">Home</a>
        <a href="#" class="px-4 py-2 rounded hover:bg-white/20">Chat</a>
        <a href="#" class="px-4 py-2 rounded hover:bg-white/20">Login</a>
      </nav>
    </div>
  </header>

  <main class="flex-1 max-w-7xl mx-auto p-6 flex items-center justify-center">
    <section class="bg-white rounded-lg shadow-xl p-8 w-full max-w-md">
      <h2 class="text-3xl font-extrabold text-center mb-6">Welcome to hichat</h2>
      <p class="text-center text-gray-600 mb-8">
        A premium, real‑time chat experience built with modern web technologies.
      </p>
      <div class="flex justify-center">
        <!-- Google Sign‑In button -->
        <div class="g_id_onload"
             data-ci="YOUR_GOOGLE_CLIENT_ID"
             data-context="signin"
             data-ux_mode="button"
             data-size="large"
             data-label="google">
          <div class="g_id_signin"
               data-type="standard"
               data-shape="rectangular"
               data-theme="outline"
               data-text="signin_with"
               data-logo="none">
          </div>
        </div>
      </div>
    </section>
  </main>

  <footer class="bg-gray-800 text-white p-6 text-center">
    <p>© 2025 hichat. All rights reserved.</p>
  </footer>

  <script type="module" src="/src/main.jsx"></script>
</body>
</html>
